name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arată fișierele
        run: find . -not -path './.git/*' -maxdepth 3 | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4

      - name: Build debug APK
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then echo "LIPSEȘTE settings.gradle"; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VisionLauncher-apk
          path: '**/app-debug.apk'
